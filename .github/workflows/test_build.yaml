name: Build package

# Manually triggered: builds the package exactly like the release
# workflow does, but makes no changes to version.xml and creates no
# commit, tag, or release. The build.yml reusable workflow uploads the
# resulting zip as a workflow artifact itself, so there's nothing else
# to do here.
on:
  workflow_dispatch:
    inputs:
      dev_build:
        description: "Build with -Ddev=TRUE (dev/git-describe version) instead of a plain release build"
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build_package.yml
    with:
      dev_build: ${{ inputs.dev_build }}