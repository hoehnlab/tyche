name: Test build

# Manually triggered: builds the package exactly like the release
# workflow does, but makes no changes to version.xml, creates no commit,
# tag, or release. Use this to debug build issues in isolation -- the
# resulting zip is attached to the workflow run as a downloadable
# artifact instead of a release asset.
on:
  workflow_dispatch: {}

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TyCHE
        uses: actions/checkout@v4
        with:
          path: type-linked-time-trees

      # No ref pinned yet -- see the same comment in release.yml. Add
      # `ref: <commit-sha>` under each of these once you want to lock in
      # a known-good set of commits.
      - name: Checkout beast2
        uses: actions/checkout@v4
        with:
          repository: CompEvol/beast2
          path: beast2

      - name: Checkout BeastFX
        uses: actions/checkout@v4
        with:
          repository: CompEvol/BeastFX
          path: BeastFX

      - name: Checkout beast-classic
        uses: actions/checkout@v4
        with:
          repository: BEAST2-Dev/beast-classic
          path: beast-classic

      - name: Set up Zulu FX JDK 17
        run: |
          curl -L -o /tmp/zulufx.tar.gz \
            https://cdn.azul.com/zulu/bin/zulu17.68.203-ca-fx-jdk17.0.20.1-linux_x64.tar.gz
          mkdir -p /opt/zulufx
          tar -xzf /tmp/zulufx.tar.gz -C /opt/zulufx --strip-components=1
          echo "JAVA_HOME=/opt/zulufx" >> "$GITHUB_ENV"
          echo "/opt/zulufx/bin" >> "$GITHUB_PATH"

      - name: Check Ant is available
        run: ant -version

      # No version bump, no commit, no tag -- version.xml is built
      # exactly as it sits in the checked-out branch/commit.
      - name: Build package
        run: |
          cd type-linked-time-trees
          ant package

      - name: Locate built zip
        id: zip
        run: |
          path=$(find type-linked-time-trees -name "TyCHE.v*.zip")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TyCHE-test-build
          path: ${{ steps.zip.outputs.path }}
          retention-days: 7